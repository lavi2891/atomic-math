<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title description">
  <title id="title">שתי משבצות שסכומן עשר</title>
  <desc id="description">שתי משבצות ריקות וביניהן סימן חיבור, ולאחריהן שווה עשר</desc>
  <rect width="640" height="280" rx="32" fill="#182840"/>
  <g fill="#253f65" stroke="#89baff" stroke-width="8">
    <rect x="70" y="70" width="140" height="140" rx="24"/>
    <rect x="270" y="70" width="140" height="140" rx="24"/>
  </g>
  <g fill="#e9f3ff" font-family="Arial, sans-serif" font-size="72" text-anchor="middle">
    <text x="240" y="165">+</text>
    <text x="455" y="165">=</text>
    <text x="555" y="165">10</text>
  </g>
</svg>
